---
- name: Resolve package, repo, and app names
  ansible.builtin.set_fact:
    resolved_repo_url: "{{ repo_url | default(app_repo_url | default(github_url | default((selections.apps[role_name].repo_url | default(selections.apps[role_name].github_url)) if (role_name is defined and selections.apps is defined and selections.apps[role_name] is defined) else ''))) }}"
    resolved_pkg_name: "{{ app_pkg if app_pkg is defined else (app_pkg_mac if ansible_system == 'Darwin' else app_pkg_win if ansible_system == 'Win32NT' else app_pkg_linux if ansible_system == 'Linux' else '') }}"
    resolved_app_name: "{{ app_name if app_name is defined else (app_name_mac if ansible_system == 'Darwin' else '') }}"

- name: Determine platform-specific installer task file
  ansible.builtin.set_fact:
    platform_task_file: >-
      {{
        'mac_install_release.yml' if (ansible_system == 'Darwin' and resolved_repo_url | length > 0)
        else (('mac_install_cask.yml' if role_category | default('apps') == 'apps' else 'mac_install_formula.yml') if ansible_system == 'Darwin' else 'win_install_package.yml' if ansible_system == 'Win32NT' else 'linux_install_package.yml')
      }}

- name: Inform user about installation progress
  ansible.builtin.debug:
    msg: "Installing {{ role_name }} ({{ resolved_repo_url if resolved_repo_url | length > 0 else resolved_pkg_name }}) from {{ 'Release' if resolved_repo_url | length > 0 else ('Homebrew Cask' if (ansible_system == 'Darwin' and role_category == 'apps') else 'Homebrew Formula' if (ansible_system == 'Darwin' and role_category != 'apps') else 'Winget' if ansible_system == 'Win32NT' else 'Native Package Manager') }}. Please wait..."
  when: (resolved_pkg_name | length > 0) or (resolved_repo_url | length > 0)

- name: Include platform-specific installer
  ansible.builtin.include_tasks: "{{ playbook_dir }}/_shared_tasks/installer/{{ platform_task_file }}"
  vars:
    pkg_name: "{{ resolved_pkg_name }}"
    app_name: "{{ resolved_app_name }}"
    repo_url: "{{ resolved_repo_url }}"
  when: (resolved_pkg_name | length > 0) or (resolved_repo_url | length > 0)
