[defaults]
inventory = localhost,
; config/content/* is listed first so a same-named role there overlays/overrides the one in content/*
roles_path = ./config/content/apps/common:./config/content/apps/mac:./config/content/apps/linux:./config/content/apps/win:./config/content/cli/common:./config/content/cli/mac:./config/content/cli/linux:./config/content/cli/win:./config/content/settings/common:./config/content/settings/mac:./config/content/settings/linux:./config/content/settings/win:./content/apps/common:./content/apps/mac:./content/apps/linux:./content/apps/win:./content/cli/common:./content/cli/mac:./content/cli/linux:./content/cli/win:./content/settings/common:./content/settings/mac:./content/settings/linux:./content/settings/win
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default

[privilege_escalation]
become_method = sudo
