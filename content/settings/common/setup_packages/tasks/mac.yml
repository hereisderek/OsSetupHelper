---
# Raw brew commands rather than community.general.homebrew/homebrew_cask —
# see _shared_tasks/installer/mac_install_formula.yml for why.
- name: Install Homebrew formulae
  ansible.builtin.command: "brew install {{ mac_pkgs.brew | join(' ') }}"
  register: brew_formulae_install
  when: (mac_pkgs.brew | default([])) | length > 0
  changed_when: brew_formulae_install.rc == 0
  failed_when: false

- name: Install Homebrew casks
  ansible.builtin.command: "brew install --cask {{ mac_pkgs.cask | join(' ') }}"
  register: brew_casks_install
  when: (mac_pkgs.cask | default([])) | length > 0
  changed_when: brew_casks_install.rc == 0
  failed_when: false

- name: Install apps via mas (App Store)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/_shared_tasks/mac_install_mas.yml"
  vars:
    mas_id: "{{ item.id }}"
    app_name: "{{ item.name }}"
  loop: "{{ mac_pkgs.mas | default([]) }}"
  when: (mac_pkgs.mas | default([])) | length > 0
  ignore_errors: true

- name: Install apps from GitHub/GitLab releases
  ansible.builtin.include_tasks: "{{ playbook_dir }}/_shared_tasks/installer/mac_install_release.yml"
  vars:
    repo_url: "{{ item.url if (item is mapping and item.url is defined) else item }}"
    release_version: "{{ item.version | default('') if item is mapping else '' }}"
    install_dir: "{{ item.install_dir | default('/Applications') if item is mapping else '/Applications' }}"
    app_name: "{{ item.name | default('') if item is mapping else '' }}"
  loop: "{{ mac_pkgs.releases | default(mac_pkgs.github_releases | default([])) }}"
  when: (mac_pkgs.releases | default(mac_pkgs.github_releases | default([]))) | length > 0
  ignore_errors: true
