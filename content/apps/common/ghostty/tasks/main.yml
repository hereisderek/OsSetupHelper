---
- name: Run installer
  ansible.builtin.include_tasks: "{{ playbook_dir }}/_shared_tasks/installer/main.yml"

- name: Ensure Ghostty config directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/ghostty"
    state: directory
    mode: "0755"

- name: Configure Ghostty
  ansible.builtin.lineinfile:
    path: "{{ ansible_user_dir }}/.config/ghostty/config"
    line: "{{ item.key }} = {{ item.value }}"
    regexp: "^{{ item.key }}\\s*="
    state: present
    create: yes
  loop: "{{ ghostty_config | dict2items }}"
