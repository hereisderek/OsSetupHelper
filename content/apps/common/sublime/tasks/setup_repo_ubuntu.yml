---
- name: Check if Sublime Text is already installed
  ansible.builtin.command: subl --version
  register: sublime_check
  failed_when: false
  changed_when: false

- name: Setup Sublime Text repository for Ubuntu
  ansible.builtin.include_tasks: "{{ playbook_dir }}/_shared_tasks/linux_add_apt_repo.yml"
  vars:
    apt_repo_name: sublime-text
    apt_repo_gpg_url: https://download.sublimetext.com/sublimehq-pub.gpg
    apt_repo_line: "deb [signed-by=/usr/share/keyrings/sublime-text.asc] https://download.sublimetext.com/ apt/stable/"
  when:
    - ansible_distribution == 'Ubuntu'
    - sublime_check.rc != 0
